<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Animated QR Photo Beam (Offline)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; text-align: center; padding: 16px; margin: 0; }
  h2 { margin: 8px 0 16px; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
  button { padding: 12px 16px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .tab-btn { background: #2b2b2b; flex: 1; max-width: 195px; }
  .tab-btn.active { background: #007bff; }
  .panel { display: none; max-width: 420px; margin: 0 auto; }
  .panel.active { display: block; }
  .card { background: #1c1c1c; padding: 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  label { font-size: 14px; color: #ccc; display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; }
  .btn-row { display: flex; gap: 10px; }
  .btn-start { background: #28a745; flex: 1; }
  .btn-stop { background: #dc3545; flex: 1; }
  #previewBox { display: none; text-align: center; background: #121212; padding: 10px; border-radius: 8px; border: 1px solid #333; }
  #previewImg { max-height: 120px; max-width: 100%; border-radius: 6px; }
  #previewInfo { font-size: 12px; color: #aaa; margin-top: 6px; }
  .qr-wrapper { background: #fff; padding: 16px; border-radius: 12px; margin: 16px auto; width: 292px; height: 292px; display: flex; align-items: center; justify-content: center; }
  #qrCanvas { display: none; width: 260px; height: 260px; image-rendering: pixelated; }
  #qrPlaceholder { color: #555; font-size: 14px; padding: 12px; }
  #video { width: 100%; border-radius: 12px; background: #000; display: none; margin-top: 12px; }
  progress { width: 100%; height: 20px; margin: 12px 0; }
  #resultBox img { max-width: 100%; border-radius: 8px; margin-top: 12px; border: 2px solid #28a745; }
  .error-banner { display: none; background: #4a1216; border: 1px solid #dc3545; color: #ff9aa1; padding: 10px 12px; border-radius: 8px; margin: 0 auto 14px auto; max-width: 420px; font-size: 14px; text-align: left; }
</style>
</head>
<body>

<h2>⚡ Animated QR Photo Beam</h2>

<div class="tabs">
  <button id="tabSend" class="tab-btn active" onclick="switchTab('send')">📤 Send Photo</button>
  <button id="tabReceive" class="tab-btn" onclick="switchTab('receive')">📷 Receive Photo</button>
</div>

<div id="errorBox" class="error-banner"></div>

<!-- SENDER -->
<div id="send" class="panel active">
  <div class="card">
    <input type="file" id="fileInput" accept="image/*">
    <div id="previewBox">
      <img id="previewImg" alt="Preview">
      <div id="previewInfo"></div>
    </div>

    <label>Image Width (Quality): <span id="wVal">280px</span></label>
    <input type="range" id="widthRange" min="120" max="500" value="280"
      oninput="document.getElementById('wVal').innerText=this.value+'px'"
      onchange="prepareImage()">

    <label>Flash Speed (FPS): <span id="fpsVal">5 FPS</span></label>
    <input type="range" id="fpsRange" min="1" max="15" value="5"
      oninput="document.getElementById('fpsVal').innerText=this.value+' FPS'; if(isFlashing) startFlashing();">

    <progress id="prepBar" value="0" max="100" style="display:none"></progress>

    <div class="btn-row">
      <button id="btnStartFlash" class="btn-start" onclick="startFlashing()" disabled>▶ Start</button>
      <button id="btnStopFlash" class="btn-stop" onclick="stopFlashing()" disabled>⏹ Stop</button>
    </div>
  </div>

  <div class="qr-wrapper">
    <span id="qrPlaceholder">Upload a photo above to generate QR frames</span>
    <canvas id="qrCanvas" width="260" height="260"></canvas>
  </div>
  <p id="sendStatus">Waiting for photo...</p>
</div>

<!-- RECEIVER -->
<div id="receive" class="panel">
  <div class="btn-row">
    <button id="btnStartScan" class="btn-start" onclick="startScanner()">📷 Start Camera</button>
    <button id="btnStopScan" class="btn-stop" onclick="stopScanner()" disabled>⏹ Stop Camera</button>
  </div>

  <video id="video" playsinline muted></video>
  <progress id="progBar" value="0" max="100"></progress>
  <p id="recStatus">Tap "Start Camera" and aim at the flashing QR screen.</p>
  <div id="resultBox"></div>
</div>

<script>
(function(){
var defs = {}, cache = {};
function req(name){
  var k = name.replace(/^\.\//, '');
  if (cache[k]) return cache[k].exports;
  var m = { exports: {} };
  cache[k] = m;
  defs[k](m, m.exports, req);
  return m.exports;
}
defs['QR8bitByte'] = function(module, exports, require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs['QRBitBuffer'] = function(module, exports, require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

defs['QRMath'] = function(module, exports, require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

};

defs['QRPolynomial'] = function(module, exports, require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

            case QRMode.MODE_ALPHA_NUM  : return 13;

        var col = 0;

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    lostPoint += (3 + sameCount - 5);
                }

            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;

                }

                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

		totalDataCount += rsBlocks[x].dataCount;
	}

            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {

		}
		buffer.put(QRCode.PAD1, 8);

		maxEcCount = Math.max(maxEcCount, ecCount);

				data[index++] = ecdata[t][xx];
			}
		}
	}

<script>
  const CHUNK_SIZE = 240;
  const QUIET_ZONE = 2;          // modules of white border around each QR
  const DISPLAY_PX = 260;

  // sender state
  let loadedImg = null;
  let chunks = [];
  let frames = [];              // pre-rendered QR frames (canvases)
  let buildToken = 0;
  let frameIndex = 0;
  let flashTimer = null;
  let isFlashing = false;

  let scanStream = null;
  let scanTimer = null;
  let scanBusy = false;
  let isScanning = false;

  const sendCanvas = document.getElementById('qrCanvas');

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = "⚠️ " + msg;
    el.style.display = 'block';
  }

  function clearError() {
    const el = document.getElementById('errorBox');
    el.style.display = 'none';
    el.textContent = '';
  }

  function switchTab(mode) {
    clearError();
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(mode).classList.add('active');
    if (mode === 'send') {
      document.getElementById('tabSend').classList.add('active');
      stopScanner();
    } else {
      document.getElementById('tabReceive').classList.add('active');
      stopFlashing();
    }
  }

  document.getElementById('fileInput').addEventListener('change', function(event) {
    clearError();
    stopFlashing();
    const files = event.target.files;
    if (!files || files.length === 0) return;
    const file = files[0];
    if (!file.type || !file.type.startsWith('image/')) {
      showError("Please choose a valid image file (JPG, PNG, or WebP).");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => showError("Unable to read the selected file.");
    reader.onload = function(loadEvent) {
      const img = new Image();
      img.onerror = () => showError("Could not load this image. Try another photo.");
      img.onload = function() {
        loadedImg = img;
        document.getElementById('previewImg').src = loadEvent.target.result;
        document.getElementById('previewBox').style.display = 'block';
        prepareImage();
      };
      img.src = loadEvent.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Step 1: shrink the photo and cut it into text chunks
  function prepareImage() {
    if (!loadedImg) return;
    stopFlashing();
    try {
      const targetWidth = parseInt(document.getElementById('widthRange').value, 10);
      const scale = targetWidth / loadedImg.width;
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = Math.max(1, Math.round(loadedImg.height * scale));
      canvas.getContext('2d').drawImage(loadedImg, 0, 0, canvas.width, canvas.height);

      let dataUrl = canvas.toDataURL('image/webp', 0.65);
      if (!dataUrl.startsWith('data:image/webp')) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.60);
      }

      chunks = [];
      for (let i = 0; i < dataUrl.length; i += CHUNK_SIZE) {
        chunks.push(dataUrl.slice(i, i + CHUNK_SIZE));
      }

      const sizeKB = (dataUrl.length / 1024).toFixed(1);
      document.getElementById('previewInfo').textContent =
        `Size: ${canvas.width}×${canvas.height}px (${sizeKB} KB) • ${chunks.length} QR frames`;

      buildFrames();
    } catch (err) {
      showError("Failed to process image: " + err.message);
    }
  }

  // Render one QR code onto its own canvas (fully offline)
  function makeFrame(text) {
    const qr = new QRCodeLib(-1, QRErrorCorrectLevel.L);
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const total = n + QUIET_ZONE * 2;
    const scale = Math.max(1, Math.floor(DISPLAY_PX / total));
    const c = document.createElement('canvas');
    c.width = total * scale;
    c.height = total * scale;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++) {
      for (let col = 0; col < n; col++) {
        if (qr.isDark(r, col)) {

        }
      }

  // Step 2: pre-render every frame so flashing only copies pictures
  async function buildFrames() {
    const token = ++buildToken;
    stopFlashing();
    frames = [];
    frameIndex = 0;

    const bar = document.getElementById('prepBar');
    const status = document.getElementById('sendStatus');
    bar.style.display = 'block';
    bar.max = chunks.length;
    bar.value = 0;
    sendCanvas.style.display = 'none';
    document.getElementById('qrPlaceholder').style.display = 'block';
    document.getElementById('qrPlaceholder').textContent = 'Preparing frames...';
    document.getElementById('btnStartFlash').disabled = true;
    status.textContent = `Preparing 0 / ${chunks.length} frames...`;

        status.textContent = `Preparing ${i + 1} / ${chunks.length} frames...`;

      if (token !== buildToken) return;

      bar.style.display = 'none';

  // Step 3: flashing just swaps prepared frames
  function startFlashing() {
    clearError();

    }

    isFlashing = true;

    document.getElementById('btnStopFlash').disabled = false;

    const fps = parseInt(document.getElementById('fpsRange').value, 10);
    flashTimer = setInterval(function() {
      drawFrame(frameIndex);
      document.getElementById('sendStatus').textContent =
        `Flashing frame ${frameIndex + 1} of ${frames.length} (${fps} FPS)`;
      frameIndex = (frameIndex + 1) % frames.length;
    }, 1000 / fps);
  }

  function stopFlashing() {
    if (flashTimer) {
      clearInterval(flashTimer);
      flashTimer = null;
    }
    isFlashing = false;
    document.getElementById('btnStartFlash').disabled = (frames.length === 0);
    document.getElementById('btnStopFlash').disabled = true;
    if (frames.length > 0) {
      document.getElementById('sendStatus').textContent =
        `Stopped at frame ${frameIndex + 1} of ${frames.length}.`;
    }
  }

  // ---------- RECEIVER ----------

  async function startScanner() {
    clearError();
    if (isScanning) return;

    if (!('BarcodeDetector' in window)) {
      showError("This browser can't read QR codes. Open this page in Google Chrome on Android.");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError("The camera needs the page to be served over HTTPS or localhost.");
      return;
    }

    try {
      detector = new BarcodeDetector({ formats: ['qr_code'] });
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
    } catch (err) {
      showError("Camera error: " + err.message);
      document.getElementById('recStatus').textContent = "Camera failed to start.";
      return;
    }

    const video = document.getElementById('video');
    video.style.display = 'block';
    video.srcObject = scanStream;
    await video.play().catch(() => {});

    receivedMap = {};
    expectedTotal = 0;
    transferDone = false;
    document.getElementById('resultBox').innerHTML = '';
    document.getElementById('progBar').value = 0;
    document.getElementById('recStatus').textContent = "Scanning... Point camera at the flashing QR screen.";

    isScanning = true;
    document.getElementById('btnStartScan').disabled = true;
    document.getElementById('btnStopScan').disabled = false;
    scanLoop();
  }

  function scanLoop() {
    if (!isScanning) return;
    const video = document.getElementById('video');
    if (!scanBusy && video.readyState >= 2) {
      scanBusy = true;
      detector.detect(video)
        .then(results => { for (const r of results) handleCode(r.rawValue); })
        .catch(() => {})
        .finally(() => {
          scanBusy = false;
          scanTimer = setTimeout(scanLoop, 30);
        });
    } else {
      scanTimer = setTimeout(scanLoop, 30);
    }
  }

  function handleCode(text) {
    if (transferDone) return;
    const parts = String(text).split('|');
    if (parts.length < 3) return;

    const idx = parseInt(parts[0], 10);
    const total = parseInt(parts[1], 10);
    const payload = parts.slice(2).join('|');
    if (isNaN(idx) || isNaN(total) || total <= 0 || idx < 0 || idx >= total) return;

    if (expectedTotal !== total) {
      receivedMap = {};
      expectedTotal = total;
    }
    if (receivedMap[idx] !== undefined) return;

    receivedMap[idx] = payload;
    const count = Object.keys(receivedMap).length;
    document.getElementById('progBar').max = total;
    document.getElementById('progBar').value = count;
    document.getElementById('recStatus').textContent =
      `Caught ${count} / ${total} frames (${Math.round((count / total) * 100)}%)...`;

    if (count === total) {
      transferDone = true;
      stopScanner();
      buildFinalImage(total);
    }
  }

  function stopScanner() {
    isScanning = false;
    clearTimeout(scanTimer);
    if (scanStream) {
      scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
    }
    const video = document.getElementById('video');
    video.srcObject = null;
    video.style.display = 'none';
    document.getElementById('btnStartScan').disabled = false;
    document.getElementById('btnStopScan').disabled = true;
  }

  function buildFinalImage(total) {
    let fullDataUrl = '';
    for (let i = 0; i < total; i++) {
      if (receivedMap[i] === undefined) {
        showError(`Missing frame ${i + 1}. Please scan again.`);
        transferDone = false;
        return;
      }
      fullDataUrl += receivedMap[i];
    }
    if (!fullDataUrl.startsWith('data:image/')) {
      showError("Decoded data is not a valid image.");
      return;
    }

    const mime = fullDataUrl.slice(5, fullDataUrl.indexOf(';'));
    const ext = mime.split('/')[1] || 'img';
    document.getElementById('recStatus').textContent = `✅ Transfer Complete! (${total} frames received)`;

    const img = document.createElement('img');
    img.onerror = () => showError("Image data was corrupted. Lower Flash Speed and scan again.");
    img.src = fullDataUrl;

    const link = document.createElement('a');
    link.href = fullDataUrl;
    link.download = `beamed-photo.${ext}`;
    link.textContent = "⬇️ Save Image to Phone";
    link.style.cssText = "color:#4da3ff;display:inline-block;margin-top:12px;font-weight:bold;text-decoration:none;font-size:16px;";

    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.appendChild(img);
    resultBox.appendChild(document.createElement('br'));
    resultBox.appendChild(link);
  }
</script>
</body>
</html>
